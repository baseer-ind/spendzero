name: project_future
description: Every craving. Zero spending. Simulation-only shopping experience — no real payments are ever processed.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/covers/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
