services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spendzero
    ports:
      - "5432:5432"
    volumes:
      - spendzero_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Containerized backend — optional. For day-to-day development,
  # scripts/dev.sh runs the backend natively with --reload instead, since
  # that gives hot reload and is what physical-device testing assumes.
  # Use this service if you want the whole stack in Docker (e.g. CI-like
  # parity checks): `docker compose --profile full up`.
  api:
    profiles: ["full"]
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SPENDZERO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/spendzero
      SPENDZERO_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  spendzero_db_data:
