name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spendzero/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendzero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPENDZERO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/spendzero
      SPENDZERO_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: alembic upgrade head
      - run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spendzero/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  mobile-rn-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spendzero/mobile-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: spendzero/mobile-rn/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo prebuild (Android)
        run: npx expo prebuild -p android --no-install
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Don't let the action install the obsolete "tools" package (removed
          # from the SDK), which fails with "Failed to find package 'tools'".
          packages: ""
      - name: Build debug APK
        working-directory: spendzero/mobile-rn/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: project-future-rn-debug-apk
          path: spendzero/mobile-rn/android/app/build/outputs/apk/debug/app-debug.apk

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spendzero/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: spendzero/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc -b
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: project-future-web-dist
          path: spendzero/web/dist

  # Compile the SAME Flutter app to web and publish the finished static site to
  # the `vercel-web` branch, which Vercel serves directly (no build on Vercel's
  # side — it can't run Flutter). This is true parity: identical screens to the
  # Android build, one codebase. base-href is "/" because Vercel serves at the
  # domain root, and a vercel.json adds SPA rewrites so client-side routes work.
  flutter-web:
    runs-on: ubuntu-latest
    needs: mobile
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Scaffold web platform folder
        working-directory: spendzero/mobile
        run: flutter create . --platforms=web --org com.projectfuture --project-name app
      - name: flutter pub get
        working-directory: spendzero/mobile
        run: flutter pub get
      - name: Build web
        working-directory: spendzero/mobile
        # --web-renderer html renders network photos as <img> tags, so real
        # product images load without canvaskit's CORS fetch restriction, and
        # the app is lighter/faster to first paint (closer to the prototype's
        # smoothness). Available on Flutter 3.24.x (this job is pinned to it).
        run: flutter build web --web-renderer html --release --base-href / --dart-define-from-file=env/production.json
      - name: Add Vercel static config (no build, serve this dir, SPA rewrites)
        working-directory: spendzero/mobile/build/web
        # Config-as-code so it overrides any stale dashboard settings (e.g. an
        # Output Directory of "dist" left over from the old React app, which
        # causes Vercel's "This page doesn't exist" 404). outputDirectory "."
        # serves these files as-is; the catch-all rewrite only applies to paths
        # with no matching static file (Vercel checks the filesystem first), so
        # main.dart.js / assets still load and unknown routes fall back to the app.
        run: |
          cat > vercel.json <<'JSON'
          {
            "framework": null,
            "buildCommand": null,
            "installCommand": null,
            "outputDirectory": ".",
            "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
          }
          JSON
      - name: Publish web build to the vercel-web branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: spendzero/mobile/build/web
          publish_branch: vercel-web
          force_orphan: true

  mobile-build:
    runs-on: ubuntu-latest
    needs: mobile
    permissions:
      # Needed so the "Publish testable APK" step can create/update a Release.
      contents: write
    env:
      # Surfaced at job level so the signing step's `if:` can test it.
      # Empty when the secret isn't configured -> release build falls back
      # to debug signing (not Play-uploadable, but still builds).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # 3.29+ is required to build supabase_flutter's transitive app_links
          # 6.x plugin on Android (older Flutter's Gradle plugin didn't expose
          # the `flutter` extension it reads, causing "Could not get unknown
          # property 'flutter'" / "compileSdkVersion is not specified"). Pinned
          # only here; the analyze/test and web jobs stay on 3.24.5.
          flutter-version: "3.29.3"
          channel: stable
      - name: Scaffold android/ios platform folders
        working-directory: spendzero
        run: ./scripts/setup_mobile_platforms.sh
      - name: Materialize upload keystore (release signing)
        # Only runs when the signing secrets are configured (repo Settings ->
        # Secrets and variables -> Actions). Without them the release build
        # still succeeds but is debug-signed and NOT Play-uploadable — the
        # signing config in setup_mobile_platforms.sh falls back to debug when
        # key.properties is absent. See docs/40-play-store-release.md.
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: spendzero/mobile/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: flutter pub get
        working-directory: spendzero/mobile
        run: flutter pub get
      - name: Build debug APK
        working-directory: spendzero/mobile
        run: flutter build apk --debug --dart-define-from-file=env/development.json
      - name: Build release APK
        working-directory: spendzero/mobile
        run: flutter build apk --release --dart-define-from-file=env/production.json
      - name: Build release App Bundle
        working-directory: spendzero/mobile
        run: flutter build appbundle --release --dart-define-from-file=env/production.json
      - uses: actions/upload-artifact@v4
        with:
          name: project-future-debug-apk
          path: spendzero/mobile/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: project-future-release-apk
          path: spendzero/mobile/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: project-future-release-aab
          path: spendzero/mobile/build/app/outputs/bundle/release/app-release.aab
      # Publish a one-tap, login-free download of the installable app on every
      # push to main. Uses a fixed "android-latest" tag so the URL is stable:
      #   https://github.com/baseer-ind/spendzero/releases/download/android-latest/project-future.apk
      - name: Publish testable APK to a GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          cp spendzero/mobile/build/app/outputs/flutter-apk/app-debug.apk project-future.apk
      - name: Create/update the android-latest release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Project Future — latest Android build"
          body: |
            Latest testable debug build of the Project Future app.

            **Install on Android:** download `project-future.apk` below, open it,
            and allow "install unknown apps" if prompted. Debug build — for
            testing only, not the Play Store release.

            Built from commit ${{ github.sha }}.
          prerelease: true
          files: project-future.apk
