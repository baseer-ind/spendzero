name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spendzero/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendzero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPENDZERO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/spendzero
      SPENDZERO_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: alembic upgrade head
      - run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spendzero/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  mobile-build:
    runs-on: ubuntu-latest
    needs: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Scaffold android/ios platform folders
        working-directory: spendzero
        run: ./scripts/setup_mobile_platforms.sh
      - name: flutter pub get
        working-directory: spendzero/mobile
        run: flutter pub get
      - name: Build debug APK
        working-directory: spendzero/mobile
        run: flutter build apk --debug --dart-define-from-file=env/development.json
      - name: Build release APK
        working-directory: spendzero/mobile
        run: flutter build apk --release --dart-define-from-file=env/production.json
      - name: Build release App Bundle
        working-directory: spendzero/mobile
        run: flutter build appbundle --release --dart-define-from-file=env/production.json
      - uses: actions/upload-artifact@v4
        with:
          name: spendzero-debug-apk
          path: spendzero/mobile/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spendzero-release-apk
          path: spendzero/mobile/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spendzero-release-aab
          path: spendzero/mobile/build/app/outputs/bundle/release/app-release.aab
