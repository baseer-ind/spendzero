# Render Blueprint for the SpendZero beta: FastAPI backend + the static web
# app. The database is Supabase Postgres (set DATABASE_URL by hand, below),
# not a Render-managed DB. Redis is intentionally omitted — the rate limiter
# fails open when Redis is unreachable (see app/core/rate_limit.py), so the
# beta runs fine without it; add one later if you want enforced limits.
#
# Deploy: https://dashboard.render.com -> New -> Blueprint -> pick the
# baseer-ind/spendzero repo. Render reads this file from the repo root.
services:
  # ---- FastAPI backend -------------------------------------------------
  - type: web
    name: spendzero-api
    runtime: python
    rootDir: spendzero/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrate, seed the fictional CATALOG only (no demo user — see the
    # SPENDZERO_SEED_DEMO_USER=false below), then boot. Catalog seeding is
    # idempotent, so re-running on every deploy is safe.
    startCommand: >-
      alembic upgrade head &&
      python -m app.db.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SPENDZERO_ENV
        value: production
      # Supabase Postgres connection string. Use the "Connection Pooling"
      # (Transaction, port 6543) URI from Supabase -> Project Settings ->
      # Database, and change the scheme to postgresql+asyncpg://. The app
      # strips sslmode/channel_binding and enables SSL automatically
      # (see app/db/session.py), so paste it as-is otherwise.
      - key: SPENDZERO_DATABASE_URL
        sync: false
      # Real beta data: do NOT create the fake "Demo Saver" user. Every
      # real guest device starts empty and builds its own dreams.
      - key: SPENDZERO_SEED_DEMO_USER
        value: "false"
      # Lock CORS to the deployed web origin. Set to your Vercel URL, e.g.
      # https://spendzero-five.vercel.app (start as "*" if unsure, then
      # tighten).
      - key: SPENDZERO_CORS_ORIGINS
        sync: false

  # ---- Web app (static Vite build) ------------------------------------
  - type: web
    name: spendzero-web
    runtime: static
    rootDir: spendzero/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Full API base URL incl. protocol + /api/v1 path, e.g.
    # https://spendzero-api.onrender.com/api/v1  (set after the API is up;
    # Vite inlines env at build time, so redeploy the web service after
    # setting this). If you're keeping the web app on Vercel instead, ignore
    # this service and set VITE_API_BASE_URL in Vercel's project settings.
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
