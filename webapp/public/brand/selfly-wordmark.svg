<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" role="img" aria-label="SELFly">
  <!-- Wordmark: SEL (self, solid) + Fly (future, champagne italic). The shared F
       spells SELFly. Serif stack falls back gracefully where Fraunces is absent. -->
  <defs>
    <linearGradient id="wm-g" x1="110" y1="34" x2="180" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A988"/><stop offset="1" stop-color="#EAD4AF"/>
    </linearGradient>
  </defs>
  <text x="2" y="35" font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="38" font-weight="500" letter-spacing="-1" fill="#FFFFFF">SEL</text>
  <text x="97" y="35" font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="38" font-weight="500" font-style="italic" letter-spacing="-1"
        fill="url(#wm-g)">Fly</text>
</svg>
